[package]
name = "openradiology-desktop"
version = "0.1.0"
description = "Deterministic DICOM workbench for traceable radiology review"
authors = ["Yusir Demir"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openradiology_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
