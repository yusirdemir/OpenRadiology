name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check openrad tests
      - name: Test (synthetic phantoms only; no patient data in CI)
        run: pytest
      - name: Test without installation (direct path run)
        run: python tests/test_pipeline.py && python tests/test_mcp.py
      - name: CLI smoke
        run: openrad --version && openrad doctor && openrad config --json > /dev/null && openrad mcp --list-tools
