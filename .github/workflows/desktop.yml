name: Desktop

on:
  push:
    branches: [main]
    paths: ["app/**", "openrad/server/**", "packaging/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["app/**", "openrad/server/**", "packaging/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on everything that does not need a Rust toolchain.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      # Scoped to the code this workflow owns. `ci.yml` lints the whole tree
      # and is currently red on 154 pre-existing E501 line-length findings,
      # mostly in openrad/mcp; fixing those is a separate change and should not
      # gate the desktop build.
      - name: Lint the sidecar
        run: ruff check openrad/server tests/test_server.py
      - name: Test the engine and the sidecar (synthetic phantoms only; no patient data in CI)
        run: pytest
      - working-directory: app
        run: npm ci
      - name: Type-check the front end
        working-directory: app
        run: npx tsc --noEmit
      - name: Test the front end
        working-directory: app
        run: npm test
      - name: Build the front end
        working-directory: app
        run: npm run build

  # The frozen engine plus the shell, on the platforms we ship.
  bundle:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon
            target: aarch64-apple-darwin
          - os: macos-13        # Intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Freeze the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[codecs]" pyinstaller
          pyinstaller --noconfirm --clean packaging/openrad-server.spec \
            --distpath packaging/dist --workpath packaging/build
        shell: bash

      - name: Check the frozen engine actually runs
        run: |
          BIN=packaging/dist/openrad-server/openrad-server
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --cli --version
          "$BIN" --cli doctor
        shell: bash

      - name: Stage the engine for bundling
        run: |
          rm -rf app/src-tauri/resources/engine
          mkdir -p app/src-tauri/resources
          cp -R packaging/dist/openrad-server app/src-tauri/resources/engine
        shell: bash

      - working-directory: app
        run: npm ci

      - name: Bundle the application
        working-directory: app
        # CI=true makes the macOS dmg bundler skip the AppleScript that styles
        # the disk-image window. That step drives Finder and hangs wherever
        # Finder is not interactive, which is every runner and every automated
        # build; the resulting image is identical apart from icon placement.
        env:
          CI: "true"
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: openradiology-${{ matrix.target }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
