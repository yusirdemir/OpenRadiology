[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openradiology"
version = "0.4.0"
description = "Deterministic DICOM workbench for traceable AI radiology review (CT, PET/CT, brain MRI): zero-GPU rendering, calibrated HU/SUV measurement, SHA-256 evidence ledger."
readme = "README.md"
authors = [{ name = "Yusir Demir" }]
license = { text = "MIT" }
keywords = [
    "radiology", "dicom", "medical-imaging", "ai-agent", "llm", "mcp", "model-context-protocol", "ct", "mri", "pet-ct",
    "suv", "hounsfield", "recist", "fleischner", "structured-reporting", "claude", "codex", "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "pydicom>=2.4.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "Pillow>=9.1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Compressed transfer syntaxes (JPEG 2000, JPEG-LS, RLE) need a decoder plugin.
codecs = ["pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.0", "pylibjpeg-openjpeg>=2.0"]
dev = ["pytest>=7.0.0", "ruff>=0.4.0", "mypy>=1.8", "jsonschema>=4.0"]

[project.scripts]
openrad = "openrad.cli:main"
openrad-server = "openrad.server.__main__:main"

[project.urls]
Homepage = "https://github.com/yusirdemir/OpenRadiology"
Repository = "https://github.com/yusirdemir/OpenRadiology.git"
Issues = "https://github.com/yusirdemir/OpenRadiology/issues"
Changelog = "https://github.com/yusirdemir/OpenRadiology/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["openrad", "openrad.locales", "openrad.mcp", "openrad.server"]

[tool.setuptools.package-data]
openrad = ["py.typed", "schema/*.json", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:pydicom"]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP006/UP007/UP045 are the same rule family: this package supports Python 3.9,
# where `X | None` and `list[int]` are not valid at runtime in every position.
ignore = ["E731", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
